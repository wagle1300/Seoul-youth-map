<style>
:root{
  --blue:#2D6BFF; --mint:#00BA8A; --amber:#FFA800; --violet:#6B4FD6; --navy:#1E2E64;
  --yellow:#FFD100;
  --ink:#171E2E; --sub:#768094; --line:#E4E9F1; --bg:#F4F7FB; --card:#FFFFFF;
  --radius:18px; --shadow:0 4px 20px rgba(40,60,110,.09);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue);text-decoration:none}

/* ── 레이아웃 ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;background:var(--bg);position:relative}

/* ── 헤더 ── */
header{
  background:linear-gradient(135deg,var(--navy),#2A3F7E);
  color:#fff;padding:16px 20px 14px;flex-shrink:0;
  box-shadow:0 2px 14px rgba(20,35,80,.18);z-index:30;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  height:42px;padding:4px 7px;border-radius:11px;background:#fff;
  display:grid;place-items:center;flex-shrink:0;
}
.brand-mark img{height:34px;width:auto;display:block}
.brand-title{font-size:20px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.brand-sub{font-size:13px;color:#B9C6E8;margin-top:2px;font-weight:600;word-break:keep-all;line-height:1.35}
#adminEntry{margin-left:auto;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-size:15px;flex-shrink:0}

/* ── 탭 ── */
nav.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0;z-index:20}
nav.tabs button{
  flex:1;padding:13px 0 11px;font-size:15px;font-weight:700;color:var(--sub);
  border-bottom:3px solid transparent;transition:.15s;
}
nav.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

/* ── 본문 ── */
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + var(--safe-b))}

/* ── 검색·필터 ── */
.toolbar{padding:12px 16px 10px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.search{position:relative}
.search input{
  width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--bg);font-size:15px;outline:none;transition:.15s;
}
.search input:focus{border-color:var(--blue);background:#fff}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px}
.chips{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:13.5px;font-weight:700;
  background:var(--bg);color:var(--sub);border:1.5px solid var(--line);white-space:nowrap;
}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* 필터 버튼 · 필터 묶음 */
.srow{display:flex;gap:8px;align-items:stretch}
.srow .search{flex:1;min-width:0}
.fbtn{flex-shrink:0;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:5px}
.fbtn.act{border-color:var(--blue);color:var(--blue)}
.fbtn .fcnt:empty{display:none}
.fbtn .fcnt{background:var(--blue);color:#fff;font-size:11px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.fgroup{margin-top:14px}
.flabel{font-size:12.5px;font-weight:800;color:var(--sub);margin-bottom:8px}
.fchips{display:flex;flex-wrap:wrap;gap:7px}
#mapWrap{flex:1;position:relative;min-width:0}
#side{display:none}
#legend{display:none}
#countSide{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--sub)}
#countSide b{color:var(--ink);font-weight:900}
#countSide button{font-size:12.5px;font-weight:800;color:var(--blue)}

/* ── 컴퓨터 화면(넓은 화면): 지도 + 오른쪽 패널 ── */
@media(min-width:1000px){
  #app{max-width:none;box-shadow:none}
  nav.tabs button[data-v="list"]{display:none}
  nav.tabs{padding:0 12px}
  nav.tabs button{flex:0 0 auto;padding:13px 26px 11px}
  #v-map{flex-direction:row}
  #v-map > .toolbar{display:none}
  #side{display:flex;flex-direction:column;width:420px;flex-shrink:0;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto}
  .side-top{background:var(--card);padding:16px 18px 14px;border-bottom:1px solid var(--line)}
  #side .list{padding:14px 16px 30px}
  #legend{display:block;position:absolute;left:14px;bottom:18px;z-index:5;background:rgba(255,255,255,.95);border:1px solid var(--line);
    border-radius:12px;padding:9px 12px;box-shadow:var(--shadow);font-size:12.5px;font-weight:700;color:#414B60}
  #legend div{display:flex;align-items:center;gap:7px;line-height:1.9}
  #legend span{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:8px}
  #introBox{max-width:760px;margin:0 auto}
  .sheet{max-width:560px}
}

/* ── 지도 ── */
#map{position:absolute;inset:0;background:#E8EDF4}  /* 부모 높이를 그대로 채움 (카카오 지도는 컨테이너 크기가 있어야 그려짐) */
.pin{position:relative;cursor:pointer;width:30px;height:40px;transform-origin:50% 100%;transition:transform .15s}
.pin svg{display:block;width:30px;height:40px;filter:drop-shadow(0 2px 3px rgba(20,35,80,.35))}
.pin:hover{transform:scale(1.15);z-index:2}
.pin .cnt{position:absolute;top:6px;left:0;width:30px;text-align:center;font-size:11px;font-weight:900;line-height:14px}
.pin.hl{z-index:3;animation:hl 1.2s ease-in-out 3}
.pin.ev{width:34px;height:45px}
.pin.ev svg{width:34px;height:45px}
.pin.ev .dd{position:absolute;bottom:42px;left:50%;transform:translateX(-50%);background:#1F2A44;color:#FFC21A;
  font-size:11px;font-weight:900;line-height:1;padding:4px 6px;border-radius:7px;white-space:nowrap;box-shadow:0 2px 6px rgba(20,35,80,.3)}
.badge.ev{color:#1F2A44}
.evbox{background:#FFF6D6;border:1px solid #FFE08A;border-radius:12px;padding:11px 13px;margin:10px 0 4px}
.evbox .when{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:#1F2A44}
.evbox .dd{background:#1F2A44;color:#FFC21A;font-size:12px;font-weight:900;padding:3px 8px;border-radius:7px;flex-shrink:0}
.evbox .more{font-size:13px;color:#6B5200;margin-top:5px;line-height:1.55}
.pin.hl svg{filter:drop-shadow(0 0 4px rgba(255,209,0,1)) drop-shadow(0 2px 3px rgba(20,35,80,.35))}
@keyframes hl{50%{transform:scale(1.12)}}
.addr-row{display:flex;gap:8px}
.addr-row input{flex:1}
.addr-row button{flex-shrink:0;padding:0 12px;border-radius:10px;background:var(--navy);color:#fff;font-size:13px;font-weight:800}
.field .hint{font-size:12px;color:var(--sub);margin-top:4px}
.map-fab{
  position:absolute;right:14px;bottom:calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:8px;z-index:5;
}
.map-fab button{
  width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:17px;border:1px solid var(--line);
}

/* ── 카드 목록 ── */
.list{padding:14px 16px}
.item{
  background:var(--card);border-radius:var(--radius);padding:15px 16px;margin-bottom:11px;
  box-shadow:var(--shadow);border-left:5px solid var(--blue);
}
.item h3{margin:0 0 5px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.badge{
  display:inline-block;padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:800;
  color:#fff;margin-bottom:7px;
}
.item p{margin:3px 0;font-size:13.5px;color:var(--sub)}
.item p b{color:var(--ink);font-weight:700;margin-right:6px}
.item-actions{display:flex;gap:8px;margin-top:11px}
.item-actions a,.item-actions button{
  flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:13.5px;font-weight:700;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);
}
.item-actions a.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.5}

/* ── 소개 ── */
.intro{padding:16px}
.sec{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:13px;box-shadow:var(--shadow)}
.sec h2{
  margin:0 0 12px;font-size:18px;font-weight:900;letter-spacing:-.4px;
  display:flex;align-items:center;gap:9px;
}
.sec h2::before{content:'';width:5px;height:19px;border-radius:3px;background:var(--blue)}
.sec .lead{font-size:15.5px;font-weight:800;color:var(--navy);margin:0 0 10px;line-height:1.5}
.sec p{margin:0 0 9px;font-size:14.5px;color:#414B60;line-height:1.68;word-break:keep-all}
.sec p:last-child{margin-bottom:0}
.tlist{display:flex;flex-direction:column;gap:9px}
.trow{display:flex;gap:11px;align-items:flex-start}
.tdot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex-shrink:0}
.trow b{font-size:14.5px;font-weight:800;display:block}
.trow span{font-size:13.5px;color:var(--sub)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:4px 0 12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{
  width:27px;height:27px;border-radius:50%;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:900;flex-shrink:0;margin-top:1px;
}
.step div{font-size:14.5px;line-height:1.55;word-break:keep-all}
.step b.st{display:block;font-size:15px;font-weight:800;color:var(--navy);margin-bottom:3px}
.step span.sd{display:block;font-size:14px;color:#414B60;line-height:1.62}
.basis{margin-top:14px;background:#EEF3FF;border-left:4px solid var(--blue);border-radius:4px 12px 12px 4px;padding:13px 15px;word-break:keep-all}
.basis .bl{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:5px}
.basis .bs{font-size:14px;font-weight:800;color:var(--navy);line-height:1.5}
.basis .bp{font-size:13px;color:#5A6478;margin:3px 0 7px;line-height:1.5}
.basis .bi{font-size:14px;font-weight:700;color:#1F2A44;line-height:1.5}
#introBox,#sheetBody,#listBox{word-break:keep-all;overflow-wrap:anywhere}
.tip{background:#FFF8E1;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#6B5200;line-height:1.6}
table.kv{width:100%;border-collapse:collapse}
table.kv td{padding:9px 0;font-size:14.5px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv tr:last-child td{border-bottom:none}
table.kv td:first-child{width:100px;padding-right:8px;word-break:keep-all;color:var(--sub);font-weight:700;font-size:13.5px}
.credit{background:var(--navy);color:#fff}
.credit h2{color:#fff}
.credit h2::before{background:var(--yellow)}
.credit p{color:#C6D2EE}
.credit .sig{
  margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);
  font-size:13px;color:#9FB0DA;line-height:1.7;
}
.credit .sig b{color:var(--yellow);font-weight:800}

/* ── 상세 시트 ── */
.sheet-bg{position:fixed;inset:0;background:rgba(15,22,40,.5);z-index:50;display:none;backdrop-filter:blur(2px)}
.sheet-bg.on{display:block}
.sheet{
  position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:720px;
  background:#fff;border-radius:22px 22px 0 0;z-index:51;padding:8px 20px calc(22px + var(--safe-b));
  max-height:82vh;overflow-y:auto;transition:transform .26s cubic-bezier(.2,.8,.3,1);
}
.sheet.on{transform:translateX(-50%) translateY(0)}
.grip{width:42px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h3{margin:0 0 6px;font-size:21px;font-weight:900;letter-spacing:-.4px}

/* ── 모달 / 관리자 ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,40,.55);z-index:60;display:none;
  align-items:center;justify-content:center;padding:18px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px}
.modal h3{margin:0 0 14px;font-size:19px;font-weight:900}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:800;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--bg);font-size:14.5px;outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff}
.field textarea{min-height:66px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:9px;margin-top:16px}
.btn{flex:1;padding:12px 0;border-radius:11px;font-size:15px;font-weight:800;text-align:center}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:#FFEDED;color:#C63737}
.admin-item{
  display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px
}
.admin-item .nm{flex:1;font-weight:700}
.admin-item button{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:800;background:var(--bg);border:1px solid var(--line)}

/* ── 토스트 / 상태 ── */
#toast{
  position:fixed;left:50%;bottom:calc(74px + var(--safe-b));transform:translateX(-50%) translateY(14px);
  background:rgba(23,30,46,.94);color:#fff;padding:11px 19px;border-radius:24px;font-size:14px;font-weight:700;
  z-index:80;opacity:0;pointer-events:none;transition:.22s;max-width:88%;text-align:center
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#notice{
  position:absolute;top:10px;left:12px;right:12px;z-index:11;display:none;align-items:center;gap:8px;
  background:#FFF6D6;border:1.5px solid #FFC21A;border-radius:22px;padding:8px 12px 8px 11px;
  box-shadow:0 3px 12px rgba(20,35,80,.18);text-align:left;font-size:13.5px;font-weight:700;color:#1F2A44;
  line-height:1.4;word-break:keep-all
}
#notice.on{display:flex}
#notice .ic{font-size:16px;flex-shrink:0}
#notice .dd{background:#1F2A44;color:#FFC21A;font-size:11.5px;font-weight:900;padding:3px 7px;border-radius:7px;flex-shrink:0}
#notice .tx{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#notice .tx b{font-weight:900}
#notice .x{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#8A7A3A}
#notice.on ~ #status{top:64px}
#status{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:20px;
  padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--sub);box-shadow:var(--shadow);
  display:none
}
#status.on{display:block}
.skeleton{background:linear-gradient(90deg,#EDF1F7 25%,#F6F8FB 50%,#EDF1F7 75%);
  background-size:200% 100%;animation:sk 1.3s infinite;border-radius:var(--radius);height:112px;margin-bottom:11px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(min-width:721px){ #app{box-shadow:0 0 40px rgba(30,45,90,.1)} }
</style>
</head>

<body>
<div id="app">

  <header>
    <div class="brand">
      <div class="brand-mark"><img src="logo.png" alt="와글 로고"></div>
      <div>
        <div class="brand-title" id="bTitle">현장맞춤형 MAP핑</div>
        <div class="brand-sub" id="bSub">지역 자원 안내 지도</div>
      </div>
      <button id="adminEntry" title="관리자">⚙</button>
    </div>
  </header>

  <nav class="tabs">
    <button data-v="map" class="on">지도</button>
    <button data-v="list">목록</button>
    <button data-v="intro">소개</button>
  </nav>

  <main>
    <!-- 지도 -->
    <section class="view on" id="v-map">
      <div class="toolbar">
        <div class="srow">
          <div class="search">
            <span class="ico">⌕</span>
            <input id="qMap" type="search" placeholder="시설 이름·주소 검색" autocomplete="off">
          </div>
          <button class="fbtn" type="button">필터<span class="fcnt"></span></button>
        </div>
        <div class="chips" id="chipsMap"></div>
      </div>
      <div id="mapWrap">
        <div id="map"></div>
        <div id="legend"></div>
        <button id="notice" type="button"></button>
        <div id="status"></div>
        <div class="map-fab">
          <button id="fitBtn" title="전체 보기">⤢</button>
          <button id="hereBtn" title="내 위치">◎</button>
        </div>
      </div>
      <!-- 컴퓨터 화면: 필터 + 목록 패널 -->
      <aside id="side">
        <div class="side-top">
          <div class="search">
            <span class="ico">⌕</span>
            <input id="qSide" type="search" placeholder="시설 이름이나 주소를 검색하세요" autocomplete="off">
          </div>
          <div id="filtersSide"></div>
          <div id="countSide"></div>
        </div>
        <div class="list" id="sideList"></div>
      </aside>
    </section>

    <!-- 목록 -->
    <section class="view" id="v-list">
      <div class="toolbar">
        <div class="srow">
          <div class="search">
            <span class="ico">⌕</span>
            <input id="qList" type="search" placeholder="시설 이름·주소 검색" autocomplete="off">
          </div>
          <button class="fbtn" type="button">필터<span class="fcnt"></span></button>
        </div>
        <div class="chips" id="chipsList"></div>
      </div>
      <div class="scroll"><div class="list" id="listBox"></div></div>
    </section>

    <!-- 소개 -->
    <section class="view" id="v-intro">
      <div class="scroll"><div class="intro" id="introBox"></div></div>
    </section>
  </main>
</div>

<!-- 상세 -->
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grip"></div><div id="sheetBody"></div></div>

<!-- 모달 -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════
   [SECTION 2]  런타임  ―  수정 불필요
   ══════════════════════════════════════════════════════════════════════ */
'use strict';

const S = {
  data: [], filterType: '', fArea: '', fDay: '', fTarget: '', query: '', view: 'map',
  map: null, overlays: [], isAdmin: false, pw: '', ready: false,
  focusId: '', focusOpened: false, geoBusy: false,
  CACHE_KEY: '', META_KEY: ''
};
/* 같은 GitHub 계정(같은 주소 앞부분)에 지도 여러 개를 올려도
   기기 저장 데이터가 섞이지 않도록 저장소 경로별로 이름을 나눕니다. */
(function () {
  const ns = location.pathname.replace(/[^/]*$/, '') || '/';
  S.CACHE_KEY = 'mapin.cache.v2:' + ns;
  S.META_KEY  = 'mapin.meta.v2:'  + ns;
})();

/* ── 유틸 ─────────────────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), ms);
}
function status(msg) {
  const s = $('#status');
  if (!msg) return s.classList.remove('on');
  s.textContent = msg; s.classList.add('on');
}
/* ── 이벤트(행사일) ───────────────────────────────────────────────── */
function isEventType(t) { const f = CONFIG.types.find(x => x.name === t); return !!(f && f.event); }
function ymd(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function parseDay(t) {
  const m = String(t).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}
/** "2026-10-15, 2026-11-15~2026-11-16" → 남은 일정, 다음 일정, D-day */
function eventInfo(txt) {
  if (!txt) return { list: [], next: null, over: false, dday: '' };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const all = String(txt).split(/[,，\n]/).map(p => {
    const [a, b] = p.split(/~|∼|〜/);
    const s = parseDay(a), e = b ? parseDay(b) : s;
    return s && e ? { s, e } : null;
  }).filter(Boolean).sort((x, y) => x.s - y.s);
  if (!all.length) return { list: [], next: null, over: false, dday: '' };
  const list = all.filter(x => ymd(x.e) >= ymd(today));
  const next = list[0] || null;
  let dday = '';
  if (next) {
    const n = Math.round((next.s - today) / 86400000);
    dday = n > 0 ? 'D-' + n : 'D-DAY';
  }
  return { list, next, over: !next, dday };
}
function fmtDay(d, y) { return (y ? d.getFullYear() + '년 ' : '') + (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + '일월화수목금토'[d.getDay()] + ')'; }
function fmtRange(x) { return +x.s === +x.e ? fmtDay(x.s) : fmtDay(x.s) + ' ~ ' + fmtDay(x.e); }
/** 일정 표시: 2026년 10월 23일(금) 15:00~17:00 */
function fmtWhen(x, hours) {
  const t = /\d/.test(hours || '') ? ' ' + hours : '';
  return (+x.s === +x.e ? fmtDay(x.s, 1) : fmtDay(x.s, 1) + ' ~ ' + fmtDay(x.e, x.s.getFullYear() !== x.e.getFullYear())) + t;
}

/** 핀·목록 색: 특별 표시 기관이면 그 색, 아니면 유형 색 */
function pinColor(r) {
  const h = CONFIG.highlight;
  return h && h.names.includes(r.name) ? h.color : typeColor(r.type);
}
function hlBadge(r) {
  const h = CONFIG.tag;
  return h && h.names.includes(r.name) ? ' <span class="badge" style="background:' + h.color + '">' + esc(h.label) + '</span>' : '';
}
function typeColor(t) {
  const f = CONFIG.types.find(x => x.name === t);
  return f ? f.color : '#8A94A8';
}
async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function track(name, params) {
  if (window.gtag) gtag('event', name, params || {});
}
/** 홈페이지 주소 정리: http(s)만 허용, www.로 시작하면 https:// 를 붙입니다 */
function safeUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)) return 'https://' + u;
  return '';
}
function telHref(t) { return 'tel:' + String(t || '').replace(/[^0-9+]/g, ''); }
function hasXY(r) { return Number.isFinite(r.lat) && Number.isFinite(r.lng); }
function shareUrl(r) { return location.origin + location.pathname + '?id=' + encodeURIComponent(r.id); }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a);
    a.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (x) {}
    a.remove(); return ok;
  }
}

/* ── 데이터 계층 ──────────────────────────────────────────────────── */
function normalize(rows) {
  return (rows || [])
    .map((r, i) => ({
      id:      String(r.id || r.ID || ('R' + i)),
      name:    String(r.name ?? r.시설명 ?? '').trim(),
      type:    String(r.type ?? r.유형 ?? '기타').trim(),
      address: String(r.address ?? r.주소 ?? '').trim(),
      lat:     parseFloat(r.lat ?? r.위도),
      lng:     parseFloat(r.lng ?? r.경도),
      tel:     String(r.tel ?? r.전화 ?? '').trim(),
      site:    String(r.site ?? r.홈페이지 ?? '').trim(),
      hours:   String(r.hours ?? r.운영시간 ?? '').trim(),
      closed:  String(r.closed ?? r.휴무일 ?? '').trim(),
      target:  String(r.target ?? r.대상 ?? '').trim(),
      desc:    String(r.desc ?? r.소개 ?? '').trim(),
      visible: String(r.visible ?? r.노출여부 ?? 'Y').trim().toUpperCase(),
      order:   (v => (v === '' || v == null || isNaN(Number(v))) ? 999 : Number(v))(r.order ?? r.정렬순서),
      dates:   String(r.dates ?? r.행사일 ?? '').trim(),
      area:    String(r.area ?? r['지역(참고)'] ?? r.지역 ?? '').trim()
    }))
    .map(r => { if (isEventType(r.type)) r.ev = eventInfo(r.dates); return r; })
    .filter(r => !(r.ev && r.ev.over))   // 끝난 행사는 숨김
    .filter(r => r.name && r.visible !== 'N' && (hasXY(r) || r.address))   // 좌표가 없어도 주소가 있으면 자동 변환
    .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name, 'ko'));
}

function readCache() {
  try { return JSON.parse(localStorage.getItem(S.CACHE_KEY) || 'null'); } catch { return null; }
}
function writeCache(rows, updatedAt) {
  try {
    localStorage.setItem(S.CACHE_KEY, JSON.stringify(rows));
    localStorage.setItem(S.META_KEY, String(updatedAt || ''));
  } catch {}
}

async function apiGet(action, extra) {
  const url = new URL(CONFIG.appsScriptUrl);
  url.searchParams.set('action', action);
  Object.entries(extra || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString(), { method: 'GET', redirect: 'follow' });
  if (!res.ok) throw new Error('네트워크 오류 ' + res.status);
  return res.json();
}

async function apiPost(payload) {
  // Content-Type 을 text/plain 으로 보내야 preflight(OPTIONS) 없이 통과합니다.
  const res = await fetch(CONFIG.appsScriptUrl, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('네트워크 오류 ' + res.status);
  return res.json();
}

/** 캐시 우선 → 서버 타임스탬프 비교 → 변경 시에만 전체 수신 */
async function loadData() {
  const cached = readCache();
  if (cached && cached.length) { S.data = cached; renderAll(); }

  if (!CONFIG.appsScriptUrl) {
    if (!S.data.length) { S.data = normalize(CONFIG.sampleData); renderAll(); }
    status('예시 데이터로 표시 중'); setTimeout(() => status(''), 2600);
    return;
  }

  try {
    if (!S.data.length) status('정보를 불러오는 중…');
    const meta = await apiGet('meta');
    const localAt = localStorage.getItem(S.META_KEY) || '';
    if (cached && cached.length && String(meta.updatedAt) === localAt) {
      status(''); return;                       // 변경 없음 → 통신 종료
    }
    const full = await apiGet('list');
    S.data = normalize(full.items);
    writeCache(S.data, full.updatedAt);
    renderAll(); status(''); 
    if (cached && cached.length) toast('최신 정보로 업데이트했습니다');
  } catch (e) {
    console.warn(e);
    if (!S.data.length) { S.data = normalize(CONFIG.sampleData); renderAll(); }
    status('오프라인 · 저장된 정보 표시 중'); setTimeout(() => status(''), 3200);
  }
}

/* ── 주소 → 좌표 자동 변환 (카카오 지도 services 라이브러리) ───────── */
const GEO_KEY = 'mapin.geo.v1';
function geoCache() { try { return JSON.parse(localStorage.getItem(GEO_KEY) || '{}'); } catch { return {}; } }
function geoSave(c) { try { localStorage.setItem(GEO_KEY, JSON.stringify(c)); } catch {} }

/** 주소로 먼저 찾고, 못 찾으면 '지역명 + 시설명'으로 장소 검색합니다 */
function geocode(address, name) {
  return new Promise(done => {
    const sv = window.kakao && kakao.maps && kakao.maps.services;
    if (!sv) return done(null);
    const byPlace = () => {
      const kw = ((CONFIG.region.name || '') + ' ' + (name || address || '')).trim();
      if (!kw) return done(null);
      new sv.Places().keywordSearch(kw, (p, st) =>
        done(st === sv.Status.OK && p[0] ? { lat: +p[0].y, lng: +p[0].x } : null));
    };
    if (!address) return byPlace();
    new sv.Geocoder().addressSearch(address, (r, st) =>
      (st === sv.Status.OK && r[0]) ? done({ lat: +r[0].y, lng: +r[0].x }) : byPlace());
  });
}

/** 좌표가 비어 있는 시설을 주소로 채워 지도에 표시합니다 (결과는 기기에 저장해 재사용) */
async function fillMissingCoords() {
  if (S.geoBusy || !S.ready) return;
  const need = S.data.filter(r => !hasXY(r) && r.address);
  if (!need.length) return;
  S.geoBusy = true;
  const cache = geoCache(); let hit = 0;
  for (const r of need) {
    let c = cache[r.address];
    if (!c) { c = await geocode(r.address, r.name); if (c) cache[r.address] = c; }
    if (c) { r.lat = c.lat; r.lng = c.lng; r.geo = 'auto'; hit++; }
  }
  geoSave(cache); S.geoBusy = false;
  if (hit) { drawPins(); focusDeepLink(); }
}

/* ── 바로가기 주소 (NFC·QR) ─────────────────────────────────────────── */
function readDeepLink() {
  const p = new URLSearchParams(location.search);
  const t = p.get('type') || p.get('유형'), q = p.get('q'), tab = p.get('tab');
  if (t && CONFIG.types.some(x => x.name === t)) S.filterType = t;
  if (q) { S.query = q; $('#qMap').value = q; $('#qList').value = q; }
  S.focusId = p.get('id') || p.get('시설') || '';
  if (tab && ['map', 'list', 'intro'].includes(tab)) switchTab(tab);
  if (S.filterType || q || S.focusId) track('deep_link', { type: t || '', id: S.focusId, q: q || '' });
}
function focusDeepLink() {
  if (!S.focusId) return;
  const r = S.data.find(x => x.id === S.focusId);
  if (!r) return;
  if (S.map && hasXY(r)) {
    S.map.setLevel(4);
    S.map.setCenter(new kakao.maps.LatLng(r.lat, r.lng));
  }
  if (!S.focusOpened) { S.focusOpened = true; openDetail(r); }
}

/* ── 필터 ─────────────────────────────────────────────────────────── */
/* ── 필터: 지역 · 운영요일 · 이용대상 ─────────────────────────────── */
const DAYS = ['일', '월', '화', '수', '목', '금', '토'];
const DAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
const TARGET_ORDER = ['초등', '중학', '고등', '후기청소년', '학교밖 청소년'];
const TARGET_LABEL = { '초등': '초등학생', '중학': '중학생', '고등': '고등학생', '학교밖 청소년': '학교밖청소년' };
function isWide() { return window.matchMedia('(min-width:1000px)').matches; }
/** "월~금 운영", "월·수~일 운영", "매주 토요일 운영" → 요일 번호 집합 (못 읽으면 null) */
function parseDays(txt) {
  const t = String(txt || '').replace(/매주|요일|운영|\s/g, '');
  if (!t || !/^[일월화수목금토·,~∼]+$/.test(t)) return null;
  const set = new Set();
  t.split(/[·,]/).filter(Boolean).forEach(part => {
    const [a, b] = part.split(/~|∼/), s = DAYS.indexOf(a), e = b ? DAYS.indexOf(b) : s;
    if (s < 0 || e < 0) return;
    for (let i = s; ; i = (i + 1) % 7) { set.add(i); if (i === e) break; }
  });
  return set.size ? set : null;
}
function openDays(r) {
  if (r._days !== undefined) return r._days;
  let d = null;
  if (r.ev && r.ev.list.length) {
    d = new Set();
    r.ev.list.forEach(x => { for (let t = new Date(x.s); t <= x.e; t.setDate(t.getDate() + 1)) d.add(t.getDay()); });
  } else {
    d = parseDays(r.hours);
    const closed = /연중무휴/.test(r.closed) ? new Set() : parseDays(r.closed);
    const tp = CONFIG.types.find(x => x.name === r.type);
    if (!d && !closed && tp && tp.alwaysOpen) d = new Set([0, 1, 2, 3, 4, 5, 6]);   // 공원 등: 운영시간이 없으면 매일
    if (!d && closed) d = new Set([0, 1, 2, 3, 4, 5, 6].filter(i => !closed.has(i)));
    else if (d && closed) closed.forEach(i => d.delete(i));
  }
  return (r._days = d);
}
function targets(r) { return String(r.target || '').split('·').map(x => x.trim()).filter(Boolean); }
function filterOptions() {
  const areas = [...new Set(S.data.map(r => r.area).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ko'));
  const tg = new Set(); S.data.forEach(r => targets(r).forEach(x => tg.add(x)));
  const tlist = TARGET_ORDER.filter(x => tg.has(x)).concat([...tg].filter(x => !TARGET_ORDER.includes(x)));
  return [
    { key: 'filterType', label: '시설 유형', opts: CONFIG.types.map(t => ({ v: t.name, t: t.name, c: t.color })) },
    { key: 'fArea',   label: '지역 (행정동)', opts: areas.map(a => ({ v: a, t: a })) },
    { key: 'fDay',    label: '운영요일', opts: DAY_ORDER.map(i => ({ v: String(i), t: DAYS[i] })) },
    { key: 'fTarget', label: '이용대상', opts: tlist.map(x => ({ v: x, t: TARGET_LABEL[x] || x })) }
  ];
}
function filterGroupsHTML() {
  return filterOptions().map(g =>
    '<div class="fgroup"><div class="flabel">' + esc(g.label) + '</div><div class="fchips">' +
    '<button class="chip' + (S[g.key] ? '' : ' on') + '" data-k="' + g.key + '" data-v="">전체</button>' +
    g.opts.map(o => '<button class="chip' + (S[g.key] === o.v ? ' on' : '') + '" data-k="' + g.key + '" data-v="' + esc(o.v) + '">' +
      (o.c ? '<span class="dot" style="background:' + o.c + '"></span>' : '') + esc(o.t) + '</button>').join('') +
    '</div></div>').join('');
}
function bindFilterChips(box) {
  box.querySelectorAll('.chip[data-k]').forEach(b => b.onclick = () => {
    S[b.dataset.k] = b.dataset.v; applyFilters();
    track('filter', { key: b.dataset.k, value: b.dataset.v || 'all' });
  });
}
function activeFilterCount() { return ['fArea', 'fDay', 'fTarget'].filter(k => S[k]).length; }
function applyFilters() {
  renderChips(); drawPins(); renderList(); renderFilterPanels();
  if (S.filterSheetOpen) openFilterSheet();
}
function resetFilters() { S.filterType = S.fArea = S.fDay = S.fTarget = ''; applyFilters(); }
function renderFilterPanels() {
  const side = $('#filtersSide');
  if (side) { side.innerHTML = filterGroupsHTML(); bindFilterChips(side); }
  const n = filtered().length, any = S.filterType || activeFilterCount() || S.query.trim();
  const cnt = $('#countSide');
  if (cnt) cnt.innerHTML = '<span>' + (any ? '조건에 맞는 곳 ' : '전체 ') + '<b>' + n + '</b>곳 표시 중</span>' +
    (any ? '<button type="button" id="resetSide">필터 초기화</button>' : '');
  const rb = $('#resetSide'); if (rb) rb.onclick = () => { S.query = ''; $$('input[type=search]').forEach(i => i.value = ''); resetFilters(); };
  const k = activeFilterCount();
  $$('.fbtn').forEach(b => { b.classList.toggle('act', !!k); b.querySelector('.fcnt').textContent = k ? k : ''; });
}
function openFilterSheet() {
  S.filterSheetOpen = true;
  const n = filtered().length;
  $('#sheetBody').innerHTML = '<h3>필터</h3><div style="height:6px"></div>' + filterGroupsHTML() +
    '<div class="btns" style="margin-top:16px"><button class="btn btn-ghost" id="fReset">초기화</button>' +
    '<button class="btn btn-primary" id="fDone">' + n + '곳 보기</button></div>';
  bindFilterChips($('#sheetBody'));
  $('#fReset').onclick = resetFilters;
  $('#fDone').onclick = closeSheet;
  $('#sheet').classList.add('on'); $('#sheetBg').classList.add('on');
}

function filtered() {
  const q = S.query.trim().toLowerCase();
  return S.data.filter(r => {
    if (S.filterType && r.type !== S.filterType) return false;
    if (S.fArea && r.area !== S.fArea) return false;
    if (S.fDay) { const d = openDays(r); if (!d || !d.has(+S.fDay)) return false; }
    if (S.fTarget && r.target && !targets(r).includes(S.fTarget)) return false;
    if (!q) return true;
    return (r.name + r.address + r.type + r.target + r.desc + r.area).toLowerCase().includes(q);
  });
}

/* ── 지도 ─────────────────────────────────────────────────────────── */
function initMap() {
  const c = CONFIG.region.center;
  S.map = new kakao.maps.Map($('#map'), {
    center: new kakao.maps.LatLng(c.lat, c.lng),
    level: CONFIG.region.level || 6
  });
  S.map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

  if (CONFIG.region.restrictBounds && CONFIG.region.bounds) {
    const b = CONFIG.region.bounds;
    const lim = new kakao.maps.LatLngBounds(
      new kakao.maps.LatLng(b.sw.lat, b.sw.lng),
      new kakao.maps.LatLng(b.ne.lat, b.ne.lng));
    kakao.maps.event.addListener(S.map, 'dragend', () => {
      if (!lim.contain(S.map.getCenter())) S.map.setCenter(new kakao.maps.LatLng(c.lat, c.lng));
    });
  }
  S.ready = true;
  drawPins();
}

/** 같은 좌표(약 15m 이내)에 있는 시설을 하나의 핀으로 묶습니다 */
function cluster(rows) {
  const g = new Map();
  rows.forEach(r => {
    const k = (r.ev ? 'ev:' + r.id + ':' : '') + r.lat.toFixed(4) + ',' + r.lng.toFixed(4);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(r);
  });
  return [...g.values()];
}

function drawPins() {
  if (!S.ready) return;
  S.overlays.forEach(o => o.setMap(null));
  S.overlays = [];

  const groups = cluster(filtered().filter(hasXY));
  const bounds = new kakao.maps.LatLngBounds();

  groups.forEach(g => {
    const head = g[0];
    const pos = new kakao.maps.LatLng(head.lat, head.lng);
    bounds.extend(pos);

    const el = document.createElement('div');
    el.className = 'pin' + (S.focusId && g.some(x => x.id === S.focusId) ? ' hl' : '');
    const col = pinColor(head);
    el.title = g.length > 1 ? head.name + ' 외 ' + (g.length - 1) + '곳' : head.name;
    if (head.ev) {
      el.className += ' ev';
      el.title = head.name + (head.ev.next ? ' · ' + fmtRange(head.ev.next) : '');
      el.innerHTML =
        (head.ev.dday ? '<span class="dd">' + esc(head.ev.dday) + '</span>' : '') +
        '<svg viewBox="0 0 30 40" aria-hidden="true">' +
        '<path d="M15 1C7.3 1 1 7.2 1 14.9c0 9.8 12.3 22.6 12.8 23.1a1.7 1.7 0 0 0 2.4 0C16.7 37.5 29 24.7 29 14.9 29 7.2 22.7 1 15 1z" fill="' + col + '" stroke="#fff" stroke-width="1.5"/>' +
        '<path d="M15 6.6l2.2 4.5 4.9.7-3.6 3.5.9 4.9-4.4-2.3-4.4 2.3.9-4.9-3.6-3.5 4.9-.7z" fill="#fff" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>';
      el.onclick = () => openDetail(head);
      const ov = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 1, clickable: true, zIndex: 5 });
      ov.setMap(S.map); S.overlays.push(ov);
      return;
    }
    el.innerHTML =
      '<svg viewBox="0 0 30 40" aria-hidden="true">' +
      '<path d="M15 1C7.3 1 1 7.2 1 14.9c0 9.8 12.3 22.6 12.8 23.1a1.7 1.7 0 0 0 2.4 0C16.7 37.5 29 24.7 29 14.9 29 7.2 22.7 1 15 1z" fill="' + col + '" stroke="#fff" stroke-width="1.5"/>' +
      '<circle cx="15" cy="14" r="6.5" fill="#fff"/></svg>' +
      (g.length > 1 ? '<span class="cnt" style="color:' + col + '">' + g.length + '</span>' : '');
    el.onclick = () => (g.length > 1 ? openGroup(g) : openDetail(head));

    const ov = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 1, clickable: true });
    ov.setMap(S.map);
    S.overlays.push(ov);
  });

  if (groups.length && CONFIG.region.autoFit && !S.focusId) S.map.setBounds(bounds, 60, 40, 60, 40);
}

/* ── 렌더링 ───────────────────────────────────────────────────────── */

      '<button class="chip' + (S.filterType === t.name ? ' on' : '') + '" data-t="' + esc(t.name) + '">' +

function renderList() {

function renderLegend() {

/** 지도 위 공지: 이벤트 중 가장 가까운 일정 하나 (끝나면 다음 이벤트로 자동 교체) */
function renderNotice() {
  const box = $('#notice'); if (!box) return;
  const evs = S.data.filter(r => r.ev && r.ev.next).sort((a, b) => a.ev.next.s - b.ev.next.s);
  const r = evs[0];
  if (!r || S.noticeClosed === r.id) { box.classList.remove('on'); return; }
  const n = r.ev.next, d = x => (x.getMonth() + 1) + '/' + x.getDate() + '(' + '일월화수목금토'[x.getDay()] + ')';
  const when = (+n.s === +n.e ? d(n.s) : d(n.s) + '~' + d(n.e)) + (/\d/.test(r.hours) ? ' ' + r.hours : '');
  box.innerHTML = '<span class="ic">📢</span><span class="dd">' + esc(r.ev.dday) + '</span>' +
    '<span class="tx"><b>' + esc(r.name) + '</b> (' + esc(when) + ')</span>' +
    '<span class="x" role="button" aria-label="공지 닫기">×</span>';
  box.classList.add('on');
  box.onclick = e => {
    if (e.target.classList.contains('x')) { S.noticeClosed = r.id; box.classList.remove('on'); return; }
    if (S.map && hasXY(r)) { S.map.setLevel(4); S.map.setCenter(new kakao.maps.LatLng(r.lat, r.lng)); }
    openDetail(r); track('notice_click', { name: r.name });
  };

function renderIntro() {
  const I = CONFIG.intro, C = I.credit;
  const fill = s => s.replace(/\{system\}/g, C.system).replace(/\{author\}/g, C.author);

  let h = '';

  // 1. 프로그램 소개
  h += '<div class="sec"><h2>' + esc(I.program.title) + '</h2>' +
       (I.program.lead ? '<p class="lead">' + esc(I.program.lead) + '</p>' : '') +
       I.program.body.map(p => '<p>' + esc(p) + '</p>').join('') + '</div>';

  // 2. 이렇게 진행했어요
  if (I.process) h += '<div class="sec"><h2>' + esc(I.process.title) + '</h2><div class="steps">' +
       I.process.steps.map((s, i) =>
         '<div class="step"><div class="n">' + (i + 1) + '</div><div><b class="st">' + esc(s.title) + '</b>' +
         '<span class="sd">' + esc(s.body) + '</span></div></div>').join('') + '</div></div>';

  // 3. 시설 유형
  h += '<div class="sec"><h2>' + esc(I.types.title) + '</h2>' +
       (I.types.note ? '<p style="margin-bottom:14px">' + esc(I.types.note) + '</p>' : '') +
       '<div class="tlist">' + CONFIG.types.map(t =>
         '<div class="trow"><div class="tdot" style="background:' + t.color + '"></div>' +
         '<div><b>' + esc(t.name) + '</b><span>' + esc(t.desc || '') + '</span></div></div>').join('') +
       '</div></div>';

  // 4. 제안배경
  if (I.background) { const B = I.background.basis;
    h += '<div class="sec"><h2>' + esc(I.background.title) + '</h2>' +
       I.background.body.map(p => '<p>' + esc(p) + '</p>').join('') +
       (B ? '<div class="basis"><div class="bl">' + esc(B.label) + '</div>' +
            '<div class="bs">' + esc(B.source) + '</div>' +
            '<div class="bp">' + esc(B.path) + '</div>' +
            '<div class="bi">' + esc(B.item) + '</div></div>' : '') + '</div>'; }

  // 5. NFC 키링
  h += '<div class="sec"><h2>' + esc(I.nfc.title) + '</h2>' +
       (I.nfc.lead ? '<p class="lead">' + esc(I.nfc.lead) + '</p>' : '') +
       '<div class="steps">' + I.nfc.steps.map((s, i) =>
         '<div class="step"><div class="n">' + (i + 1) + '</div><div>' + esc(s) + '</div></div>').join('') +
       '</div>' + (I.nfc.tip ? '<div class="tip">' + esc(I.nfc.tip) + '</div>' : '') + '</div>';

  // 4. 기본 정보
  h += '<div class="sec"><h2>' + esc(I.basic.title) + '</h2><table class="kv">' +
       I.basic.rows.map(r => '<tr><td>' + esc(r.label) + '</td><td>' + esc(r.value) + '</td></tr>').join('') +
       '</table></div>';

  // 5. 문의 및 안내
  h += '<div class="sec"><h2>' + esc(I.contact.title) + '</h2><table class="kv">' +
       I.contact.rows.map(r => '<tr><td>' + esc(r.label) + '</td><td>' +
         (r.href ? '<a href="' + esc(r.href) + '"' + (/^https?:/.test(r.href) ? ' target="_blank" rel="noopener"' : '') + '>' + esc(r.value) + '</a>' : esc(r.value)) +
         '</td></tr>').join('') + '</table>' +
       (I.contact.notice ? '<div class="tip" style="margin-top:13px">' + esc(I.contact.notice) + '</div>' : '') +
       '</div>';

  // 6. 저작권
  h += '<div class="sec credit"><h2>' + esc(C.system) + '</h2>' +
       C.lines.map(l => '<p>' + esc(fill(l)) + '</p>').join('') +
       '<div class="sig">' +
         '<b>' + esc(C.system) + '</b>　기획·설계 ' + esc(C.author) + '<br>' +
         '© ' + esc(C.year) + ' ' + esc(C.system) + '. ' + esc(C.notice) +
       '</div></div>';

  $('#introBox').innerHTML = h;
}

function openModal(html) { $('#modal').innerHTML = html; $('#modalBg').classList.add('on'); }
function closeModal() { $('#modalBg').classList.remove('on'); }

function adminLogin() {
  if (S.isAdmin) return adminPanel();
  openModal(
    '<h3>관리자 로그인</h3>' +
    '<div class="field"><label>비밀번호</label><input type="password" id="pw" autocomplete="current-password"></div>' +
    '<div class="btns"><button class="btn btn-ghost" id="c">닫기</button>' +
    '<button class="btn btn-primary" id="ok">로그인</button></div>');
  $('#c').onclick = closeModal;
  const go = async () => {
    const pw = $('#pw').value;
    const h = await sha256(pw);
    // 화면 잠금 해제는 여기서, 실제 저장 권한은 Apps Script가 비밀번호를 다시 검사합니다.
    // (해시 값은 소스에 공개되어 있으므로 해시가 아닌 비밀번호를 보냅니다)
    if (h === CONFIG.adminPasswordHash) { S.isAdmin = true; S.pw = pw; adminPanel(); }
    else toast('비밀번호가 올바르지 않습니다');
  };
  $('#ok').onclick = go;
  $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
  const pwEl = $('#pw'); setTimeout(() => pwEl && pwEl.isConnected && pwEl.focus(), 80);
}

  openModal(
    '<h3>시설 관리 <span style="font-size:13px;color:var(--sub);font-weight:600">(' + S.data.length + '곳)</span></h3>' +

      '<div class="tip" style="margin-bottom:12px">스프레드시트가 연결되지 않아 예시 데이터를 보고 있습니다. 저장 기능은 연결 후 사용할 수 있습니다.</div>') +
    '<div style="max-height:44vh;overflow-y:auto;margin-bottom:6px">' +
    S.data.map(r =>
      '<div class="admin-item">' +
      '<span style="width:11px;height:11px;border-radius:50%;background:' + typeColor(r.type) + '"></span>' +
      '<span class="nm">' + esc(r.name) + '</span>' +
      '<button data-e="' + esc(r.id) + '">수정</button>' +
      '<button data-d="' + esc(r.id) + '">삭제</button></div>').join('') +
    '</div>' +
    (CONFIG.appsScriptUrl && autoRows().length ?
      '<div class="tip" style="margin:8px 0 4px">주소로 위치를 자동으로 찾은 시설이 ' + autoRows().length + '곳 있습니다. ' +
      '시트에 좌표를 저장해 두면 다음부터 더 빨리 표시됩니다.' +
      '<div class="btns" style="margin-top:9px"><button class="btn btn-primary" id="saveGeo">좌표 시트에 저장</button></div></div>' : '') +
    '<div class="btns"><button class="btn btn-ghost" id="c">닫기</button>' +
    '<button class="btn btn-primary" id="add">＋ 시설 추가</button></div>');

  $('#modal').querySelectorAll('button[data-e]').forEach(b =>

    b.onclick = () => adminDelete(S.data.find(x => x.id === b.dataset.d)));

function autoRows() { return S.data.filter(r => r.geo === 'auto'); }
function toRecord(r) {
  return { id: r.id, name: r.name, type: r.type, address: r.address,
    lat: hasXY(r) ? r.lat : '', lng: hasXY(r) ? r.lng : '',
    tel: r.tel, site: r.site, hours: r.hours, closed: r.closed, target: r.target, desc: r.desc,
    visible: r.visible || 'Y', order: r.order === 999 ? '' : r.order };
}
async function saveAutoCoords() {
  const rows = autoRows(); let ok = 0;
  $('#saveGeo').textContent = '저장 중… (0/' + rows.length + ')';
  for (const r of rows) {
    try {
      const res = await apiPost({ action: 'upsert', password: S.pw, record: toRecord(r) });
      if (res.ok) { ok++; r.geo = ''; }
    } catch (e) {}
    if ($('#saveGeo')) $('#saveGeo').textContent = '저장 중… (' + ok + '/' + rows.length + ')';
  }
  toast(ok + '곳의 좌표를 시트에 저장했습니다');
  localStorage.removeItem(S.META_KEY); await loadData(); adminPanel();
}

function adminForm(r) {
  const v = k => esc(r ? r[k] : '');
  openModal(
    '<h3>' + (r ? '시설 수정' : '시설 추가') + '</h3>' +
    '<div class="field"><label>시설명 *</label><input id="f_name" value="' + v('name') + '"></div>' +
    '<div class="field"><label>유형 *</label><select id="f_type">' +
      CONFIG.types.map(t => '<option' + (r && r.type === t.name ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') +
    '</select></div>' +
    '<div class="field"><label>주소 *</label><div class="addr-row"><input id="f_address" value="' + v('address') + '">' +
      '<button type="button" id="geoBtn">위치 찾기</button></div>' +
      '<div class="hint">주소만 넣으면 위도·경도는 자동으로 채워집니다.</div></div>' +
    '<div class="row2">' +
      '<div class="field"><label>위도 (자동)</label><input id="f_lat" inputmode="decimal" value="' + (r && hasXY(r) ? r.lat : '') + '"></div>' +
      '<div class="field"><label>경도 (자동)</label><input id="f_lng" inputmode="decimal" value="' + (r && hasXY(r) ? r.lng : '') + '"></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="field"><label>전화</label><input id="f_tel" value="' + v('tel') + '"></div>' +
      '<div class="field"><label>정렬순서</label><input id="f_order" inputmode="numeric" value="' + (r && r.order !== 999 ? r.order : '') + '"></div>' +
    '</div>' +
    '<div class="field"><label>홈페이지</label><input id="f_site" value="' + v('site') + '"></div>' +
    '<div class="field"><label>운영 시간</label><input id="f_hours" value="' + v('hours') + '"></div>' +
    '<div class="field"><label>휴무일</label><input id="f_closed" value="' + v('closed') + '"></div>' +
    '<div class="field"><label>이용 대상</label><input id="f_target" value="' + v('target') + '"></div>' +
    '<div class="field"><label>소개</label><textarea id="f_desc">' + v('desc') + '</textarea></div>' +
    '<div class="field"><label>노출 여부</label><select id="f_visible">' +
      '<option value="Y"' + (r && r.visible === 'N' ? '' : ' selected') + '>Y · 지도에 표시</option>' +
      '<option value="N"' + (r && r.visible === 'N' ? ' selected' : '') + '>N · 숨김</option></select></div>' +
    '<div class="btns"><button class="btn btn-ghost" id="c">취소</button>' +
    '<button class="btn btn-primary" id="save">저장</button></div>');
  $('#c').onclick = adminPanel;
  const findXY = async () => {
    const addr = $('#f_address').value.trim(), nm = $('#f_name').value.trim();
    if (!addr && !nm) { toast('주소를 먼저 입력해 주세요'); return null; }
    if (!(window.kakao && kakao.maps && kakao.maps.services)) { toast('지도 연결 후 사용할 수 있습니다. 좌표를 직접 넣어 주세요'); return null; }
    const c = await geocode(addr, nm);
    if (!c) { toast('위치를 찾지 못했습니다. 도로명 주소로 다시 입력해 주세요'); return null; }
    $('#f_lat').value = c.lat.toFixed(6); $('#f_lng').value = c.lng.toFixed(6);
    return c;
  };
  $('#geoBtn').onclick = async () => { if (await findXY()) toast('위치를 찾았습니다'); };
  $('#save').onclick = async () => {
    if ((!$('#f_lat').value.trim() || !$('#f_lng').value.trim()) && $('#f_address').value.trim()) await findXY();
    const rec = {
      id: r ? r.id : 'F' + Date.now(),
      name: $('#f_name').value.trim(), type: $('#f_type').value,
      address: $('#f_address').value.trim(),
      lat: parseFloat($('#f_lat').value), lng: parseFloat($('#f_lng').value),
      tel: $('#f_tel').value.trim(), site: $('#f_site').value.trim(),
      hours: $('#f_hours').value.trim(), closed: $('#f_closed').value.trim(),
      target: $('#f_target').value.trim(), desc: $('#f_desc').value.trim(),
      visible: $('#f_visible').value,
      order: $('#f_order').value.trim() === '' ? '' : Number($('#f_order').value)
    };
    if (!isFinite(rec.lat) || !isFinite(rec.lng)) { rec.lat = ''; rec.lng = ''; }
    if (!rec.name || (rec.lat === '' && !rec.address))
      return toast('시설명과 주소(또는 위도·경도)는 반드시 입력해야 합니다');
    if (!CONFIG.appsScriptUrl) return toast('스프레드시트 연결 후 사용할 수 있습니다');
    try {
      $('#save').textContent = '저장 중…';
      const res = await apiPost({ action: 'upsert', password: S.pw, record: rec });
      if (!res.ok) throw new Error(res.message || '저장 실패');
      toast('저장했습니다'); localStorage.removeItem(S.META_KEY);
      await loadData(); adminPanel();
    } catch (e) { toast('저장하지 못했습니다: ' + e.message); $('#save').textContent = '저장'; }
  };
}

async function adminDelete(r) {
  if (!r || !confirm('"' + r.name + '"을(를) 삭제할까요? 되돌릴 수 없습니다.')) return;
  if (!CONFIG.appsScriptUrl) return toast('스프레드시트 연결 후 사용할 수 있습니다');
  try {
    const res = await apiPost({ action: 'delete', password: S.pw, id: r.id });
    if (!res.ok) throw new Error(res.message || '삭제 실패');
    toast('삭제했습니다'); localStorage.removeItem(S.META_KEY);
    await loadData(); adminPanel();
  } catch (e) { toast('삭제하지 못했습니다: ' + e.message); }
}

/* ── 초기화 ───────────────────────────────────────────────────────── */
function switchTab(v) {
  $$('nav.tabs button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  $$('.view').forEach(x => x.classList.remove('on'));
  $('#v-' + v).classList.add('on');
  S.view = v;
  if (v === 'map' && S.map) setTimeout(() => S.map.relayout(), 60);
}

function bindUI() {
  $('#bTitle').textContent = CONFIG.brand.title;
  $('#bSub').textContent = CONFIG.brand.subtitle;
  document.title = CONFIG.brand.title + ' · ' + CONFIG.brand.subtitle;

  $$('nav.tabs button').forEach(b => b.onclick = () => {
    switchTab(b.dataset.v);
    track('tab_view', { tab: b.dataset.v });
  });

  const onQuery = e => {
    S.query = e.target.value;
    $$('input[type=search]').forEach(i => { if (i !== e.target) i.value = S.query; });
    drawPins(); renderList(); renderFilterPanels();
  };
  $('#qMap').oninput = onQuery;
  $('#qList').oninput = onQuery;
  $('#qSide').oninput = onQuery;
  $$('.fbtn').forEach(b => b.onclick = openFilterSheet);
  const mq = window.matchMedia('(min-width:1000px)');
  const onWide = () => { if (mq.matches && S.view === 'list') switchTab('map'); if (S.map) setTimeout(() => S.map.relayout(), 80); };
  if (mq.addEventListener) mq.addEventListener('change', onWide); else if (mq.addListener) mq.addListener(onWide);

  $('#sheetBg').onclick = closeSheet;
  $('#modalBg').onclick = e => { if (e.target.id === 'modalBg') closeModal(); };
  $('#adminEntry').onclick = adminLogin;
  $('#fitBtn').onclick = () => { CONFIG.region.autoFit = true; S.focusId = ''; drawPins(); };
  $('#hereBtn').onclick = () => {
    if (!S.map) return toast('지도가 준비되지 않았습니다');
    if (!navigator.geolocation) return toast('위치 기능을 사용할 수 없습니다');
    navigator.geolocation.getCurrentPosition(
      p => { S.map.setCenter(new kakao.maps.LatLng(p.coords.latitude, p.coords.longitude)); S.map.setLevel(4); },
      () => toast('위치 권한을 허용해 주세요'));
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeSheet(); closeModal(); }
  });
}

function loadKakao() {
  return new Promise((ok, ng) => {
    if (!CONFIG.kakaoJsKey || CONFIG.kakaoJsKey.includes('여기에')) {
      return ng(new Error('카카오 JavaScript 키가 설정되지 않았습니다'));
    }
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + CONFIG.kakaoJsKey + '&autoload=false&libraries=services';
    s.onload = () => kakao.maps.load(ok);
    s.onerror = () => ng(new Error('카카오 지도를 불러오지 못했습니다'));
    document.head.appendChild(s);
  });
}

function loadGA() {
  if (!CONFIG.gaMeasurementId) return;
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + CONFIG.gaMeasurementId;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', CONFIG.gaMeasurementId);
}

(async function init() {
  bindUI();
  readDeepLink();
  renderIntro();
  loadGA();
  $('#listBox').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

  try { await loadKakao(); initMap(); }
  catch (e) {
    $('#map').innerHTML =
      '<div class="empty" style="padding-top:90px"><div class="big">◌</div>' +
      esc(e.message) + '<br><span style="font-size:13px">CONFIG의 kakaoJsKey를 확인해 주세요.</span></div>';
  }
  await loadData();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
