<style>
:root{
  --blue:#2D6BFF; --mint:#00BA8A; --amber:#FFA800; --violet:#6B4FD6; --navy:#1E2E64;
  --yellow:#FFD100;
  --ink:#171E2E; --sub:#768094; --line:#E4E9F1; --bg:#F4F7FB; --card:#FFFFFF;
  --radius:18px; --shadow:0 4px 20px rgba(40,60,110,.09);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--blue);text-decoration:none}

/* ── 레이아웃 ── */
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;background:var(--bg);position:relative}

/* ── 헤더 ── */
header{
  background:linear-gradient(135deg,var(--navy),#2A3F7E);
  color:#fff;padding:16px 20px 14px;flex-shrink:0;
  box-shadow:0 2px 14px rgba(20,35,80,.18);z-index:30;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;background:var(--yellow);
  display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--navy);letter-spacing:-.5px;flex-shrink:0;
}
.brand-title{font-size:20px;font-weight:900;letter-spacing:-.4px;line-height:1.2}
.brand-sub{font-size:13px;color:#B9C6E8;margin-top:2px;font-weight:600}
#adminEntry{margin-left:auto;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;font-size:15px;flex-shrink:0}

/* ── 탭 ── */
nav.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0;z-index:20}
nav.tabs button{
  flex:1;padding:13px 0 11px;font-size:15px;font-weight:700;color:var(--sub);
  border-bottom:3px solid transparent;transition:.15s;
}
nav.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}

/* ── 본문 ── */
main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + var(--safe-b))}

/* ── 검색·필터 ── */
.toolbar{padding:12px 16px 10px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
.search{position:relative}
.search input{
  width:100%;padding:11px 14px 11px 40px;border:1.5px solid var(--line);border-radius:12px;
  background:var(--bg);font-size:15px;outline:none;transition:.15s;
}
.search input:focus{border-color:var(--blue);background:#fff}
.search .ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px}
.chips{display:flex;gap:7px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:13.5px;font-weight:700;
  background:var(--bg);color:var(--sub);border:1.5px solid var(--line);white-space:nowrap;
}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* ── 지도 ── */
#map{position:absolute;inset:0;background:#E8EDF4}  /* 부모 높이를 그대로 채움 (카카오 지도는 컨테이너 크기가 있어야 그려짐) */
.pin{position:relative;cursor:pointer}
.pin-body{
  padding:6px 11px 6px 9px;border-radius:16px;color:#fff;font-size:12.5px;font-weight:800;

}
.pin-body .cnt{background:rgba(255,255,255,.28);border-radius:9px;padding:0 6px;font-size:11.5px}

.pin.hl{z-index:3}

.addr-row{display:flex;gap:8px}
.addr-row input{flex:1}
.addr-row button{flex-shrink:0;padding:0 12px;border-radius:10px;background:var(--navy);color:#fff;font-size:13px;font-weight:800}
.field .hint{font-size:12px;color:var(--sub);margin-top:4px}
.map-fab{
  position:absolute;right:14px;bottom:calc(18px + var(--safe-b));display:flex;flex-direction:column;gap:8px;z-index:5;
}
.map-fab button{
  width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:var(--shadow);
  display:grid;place-items:center;font-size:17px;border:1px solid var(--line);
}

/* ── 카드 목록 ── */
.list{padding:14px 16px}
.item{
  background:var(--card);border-radius:var(--radius);padding:15px 16px;margin-bottom:11px;
  box-shadow:var(--shadow);border-left:5px solid var(--blue);
}
.item h3{margin:0 0 5px;font-size:17px;font-weight:800;letter-spacing:-.3px}
.badge{
  display:inline-block;padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:800;
  color:#fff;margin-bottom:7px;
}
.item p{margin:3px 0;font-size:13.5px;color:var(--sub)}
.item p b{color:var(--ink);font-weight:700;margin-right:6px}
.item-actions{display:flex;gap:8px;margin-top:11px}
.item-actions a,.item-actions button{
  flex:1;text-align:center;padding:9px 0;border-radius:10px;font-size:13.5px;font-weight:700;
  background:var(--bg);color:var(--ink);border:1px solid var(--line);
}
.item-actions a.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.empty{text-align:center;padding:60px 20px;color:var(--sub)}
.empty .big{font-size:40px;margin-bottom:10px;opacity:.5}

/* ── 소개 ── */
.intro{padding:16px}
.sec{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:13px;box-shadow:var(--shadow)}
.sec h2{
  margin:0 0 12px;font-size:18px;font-weight:900;letter-spacing:-.4px;
  display:flex;align-items:center;gap:9px;
}
.sec h2::before{content:'';width:5px;height:19px;border-radius:3px;background:var(--blue)}
.sec .lead{font-size:15.5px;font-weight:800;color:var(--navy);margin:0 0 10px;line-height:1.5}
.sec p{margin:0 0 9px;font-size:14.5px;color:#414B60;line-height:1.68}
.sec p:last-child{margin-bottom:0}
.tlist{display:flex;flex-direction:column;gap:9px}
.trow{display:flex;gap:11px;align-items:flex-start}
.tdot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex-shrink:0}
.trow b{font-size:14.5px;font-weight:800;display:block}
.trow span{font-size:13.5px;color:var(--sub)}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:10px;margin:4px 0 12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{
  width:27px;height:27px;border-radius:50%;background:var(--blue);color:#fff;
  display:grid;place-items:center;font-size:14px;font-weight:900;flex-shrink:0;margin-top:1px;
}
.step div{font-size:14.5px;line-height:1.55}
.tip{background:#FFF8E1;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#6B5200;line-height:1.6}
table.kv{width:100%;border-collapse:collapse}
table.kv td{padding:9px 0;font-size:14.5px;border-bottom:1px solid var(--line);vertical-align:top}
table.kv tr:last-child td{border-bottom:none}
table.kv td:first-child{width:96px;color:var(--sub);font-weight:700;font-size:13.5px}
.credit{background:var(--navy);color:#fff}
.credit h2{color:#fff}
.credit h2::before{background:var(--yellow)}
.credit p{color:#C6D2EE}
.credit .sig{
  margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18);
  font-size:13px;color:#9FB0DA;line-height:1.7;
}
.credit .sig b{color:var(--yellow);font-weight:800}

/* ── 상세 시트 ── */
.sheet-bg{position:fixed;inset:0;background:rgba(15,22,40,.5);z-index:50;display:none;backdrop-filter:blur(2px)}
.sheet-bg.on{display:block}
.sheet{
  position:fixed;left:50%;transform:translateX(-50%) translateY(100%);bottom:0;width:100%;max-width:720px;
  background:#fff;border-radius:22px 22px 0 0;z-index:51;padding:8px 20px calc(22px + var(--safe-b));
  max-height:82vh;overflow-y:auto;transition:transform .26s cubic-bezier(.2,.8,.3,1);
}
.sheet.on{transform:translateX(-50%) translateY(0)}
.grip{width:42px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h3{margin:0 0 6px;font-size:21px;font-weight:900;letter-spacing:-.4px}

/* ── 모달 / 관리자 ── */
.modal-bg{position:fixed;inset:0;background:rgba(15,22,40,.55);z-index:60;display:none;
  align-items:center;justify-content:center;padding:18px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:22px}
.modal h3{margin:0 0 14px;font-size:19px;font-weight:900}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:800;color:var(--sub);margin-bottom:5px}
.field input,.field select,.field textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  background:var(--bg);font-size:14.5px;outline:none
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);background:#fff}
.field textarea{min-height:66px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:9px;margin-top:16px}
.btn{flex:1;padding:12px 0;border-radius:11px;font-size:15px;font-weight:800;text-align:center}
.btn-primary{background:var(--blue);color:#fff}
.btn-ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn-danger{background:#FFEDED;color:#C63737}
.admin-item{
  display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px
}
.admin-item .nm{flex:1;font-weight:700}
.admin-item button{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:800;background:var(--bg);border:1px solid var(--line)}

/* ── 토스트 / 상태 ── */
#toast{
  position:fixed;left:50%;bottom:calc(74px + var(--safe-b));transform:translateX(-50%) translateY(14px);
  background:rgba(23,30,46,.94);color:#fff;padding:11px 19px;border-radius:24px;font-size:14px;font-weight:700;
  z-index:80;opacity:0;pointer-events:none;transition:.22s;max-width:88%;text-align:center
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#status{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:10;
  background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:20px;
  padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--sub);box-shadow:var(--shadow);
  display:none
}
#status.on{display:block}
.skeleton{background:linear-gradient(90deg,#EDF1F7 25%,#F6F8FB 50%,#EDF1F7 75%);
  background-size:200% 100%;animation:sk 1.3s infinite;border-radius:var(--radius);height:112px;margin-bottom:11px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(min-width:721px){ #app{box-shadow:0 0 40px rgba(30,45,90,.1)} }
</style>

<script>
/* ══════════════════════════════════════════════════════════════════════
   [SECTION 2]  런타임  ―  수정 불필요
   ══════════════════════════════════════════════════════════════════════ */
'use strict';

const S = {
  data: [], filterType: '', query: '', view: 'map',
  map: null, overlays: [], isAdmin: false, pw: '', ready: false,
  focusId: '', focusOpened: false, geoBusy: false,
  CACHE_KEY: '', META_KEY: ''
};
/* 같은 GitHub 계정(같은 주소 앞부분)에 지도 여러 개를 올려도
   기기 저장 데이터가 섞이지 않도록 저장소 경로별로 이름을 나눕니다. */
(function () {
  const ns = location.pathname.replace(/[^/]*$/, '') || '/';
  S.CACHE_KEY = 'mapin.cache.v2:' + ns;
  S.META_KEY  = 'mapin.meta.v2:'  + ns;
})();

/* ── 유틸 ─────────────────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  const t = $('#toast'); t.textContent = msg; t.classList.add('on');

}
function status(msg) {
  const s = $('#status');
  if (!msg) return s.classList.remove('on');
  s.textContent = msg; s.classList.add('on');
}
function typeColor(t) {
  const f = CONFIG.types.find(x => x.name === t);
  return f ? f.color : '#8A94A8';
}
async function sha256(txt) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function track(name, params) {
  if (window.gtag) gtag('event', name, params || {});
}
/** 홈페이지 주소 정리: http(s)만 허용, www.로 시작하면 https:// 를 붙입니다 */
function safeUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(u)) return 'https://' + u;
  return '';
}
function telHref(t) { return 'tel:' + String(t || '').replace(/[^0-9+]/g, ''); }
function hasXY(r) { return Number.isFinite(r.lat) && Number.isFinite(r.lng); }
function shareUrl(r) { return location.origin + location.pathname + '?id=' + encodeURIComponent(r.id); }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; }
  catch (e) {
    const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a);
    a.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (x) {}
    a.remove(); return ok;
  }

/* ── 데이터 계층 ──────────────────────────────────────────────────── */
function normalize(rows) {
  return (rows || [])
    .map((r, i) => ({
      id:      String(r.id || r.ID || ('R' + i)),
      name:    String(r.name ?? r.시설명 ?? '').trim(),
      type:    String(r.type ?? r.유형 ?? '기타').trim(),
      address: String(r.address ?? r.주소 ?? '').trim(),
      lat:     parseFloat(r.lat ?? r.위도),
      lng:     parseFloat(r.lng ?? r.경도),
      tel:     String(r.tel ?? r.전화 ?? '').trim(),
      site:    String(r.site ?? r.홈페이지 ?? '').trim(),
      hours:   String(r.hours ?? r.운영시간 ?? '').trim(),
      closed:  String(r.closed ?? r.휴무일 ?? '').trim(),
      target:  String(r.target ?? r.대상 ?? '').trim(),
      desc:    String(r.desc ?? r.소개 ?? '').trim(),
      visible: String(r.visible ?? r.노출여부 ?? 'Y').trim().toUpperCase(),
      order:   (v => (v === '' || v == null || isNaN(Number(v))) ? 999 : Number(v))(r.order ?? r.정렬순서)
    }))
    .filter(r => r.name && r.visible !== 'N' && (hasXY(r) || r.address))   // 좌표가 없어도 주소가 있으면 자동 변환
    .sort((a, b) => a.order - b.order || a.name.localeCompare(b.name, 'ko'));
}

function readCache() {
  try { return JSON.parse(localStorage.getItem(S.CACHE_KEY) || 'null'); } catch { return null; }
}
function writeCache(rows, updatedAt) {
  try {
    localStorage.setItem(S.CACHE_KEY, JSON.stringify(rows));
    localStorage.setItem(S.META_KEY, String(updatedAt || ''));
  } catch {}
}

async function apiGet(action, extra) {
  const url = new URL(CONFIG.appsScriptUrl);
  url.searchParams.set('action', action);
  Object.entries(extra || {}).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url.toString(), { method: 'GET', redirect: 'follow' });
  if (!res.ok) throw new Error('네트워크 오류 ' + res.status);
  return res.json();
}

async function apiPost(payload) {
  // Content-Type 을 text/plain 으로 보내야 preflight(OPTIONS) 없이 통과합니다.
  const res = await fetch(CONFIG.appsScriptUrl, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error('네트워크 오류 ' + res.status);
  return res.json();
}

/** 캐시 우선 → 서버 타임스탬프 비교 → 변경 시에만 전체 수신 */
async function loadData() {
  const cached = readCache();
  if (cached && cached.length) { S.data = cached; renderAll(); }

  if (!CONFIG.appsScriptUrl) {
    if (!S.data.length) { S.data = normalize(CONFIG.sampleData); renderAll(); }
    status('예시 데이터로 표시 중'); setTimeout(() => status(''), 2600);
    return;
  }

  try {
    if (!S.data.length) status('정보를 불러오는 중…');
    const meta = await apiGet('meta');
    const localAt = localStorage.getItem(S.META_KEY) || '';
    if (cached && cached.length && String(meta.updatedAt) === localAt) {
      status(''); return;                       // 변경 없음 → 통신 종료
    }
    const full = await apiGet('list');
    S.data = normalize(full.items);
    writeCache(S.data, full.updatedAt);
    renderAll(); status(''); 
    if (cached && cached.length) toast('최신 정보로 업데이트했습니다');
  } catch (e) {
    console.warn(e);
    if (!S.data.length) { S.data = normalize(CONFIG.sampleData); renderAll(); }
    status('오프라인 · 저장된 정보 표시 중'); setTimeout(() => status(''), 3200);
  }
}

/* ── 주소 → 좌표 자동 변환 (카카오 지도 services 라이브러리) ───────── */
const GEO_KEY = 'mapin.geo.v1';
function geoCache() { try { return JSON.parse(localStorage.getItem(GEO_KEY) || '{}'); } catch { return {}; } }
function geoSave(c) { try { localStorage.setItem(GEO_KEY, JSON.stringify(c)); } catch {} }

/** 주소로 먼저 찾고, 못 찾으면 '지역명 + 시설명'으로 장소 검색합니다 */
function geocode(address, name) {
  return new Promise(done => {
    const sv = window.kakao && kakao.maps && kakao.maps.services;
    if (!sv) return done(null);
    const byPlace = () => {
      const kw = ((CONFIG.region.name || '') + ' ' + (name || address || '')).trim();
      if (!kw) return done(null);
      new sv.Places().keywordSearch(kw, (p, st) =>
        done(st === sv.Status.OK && p[0] ? { lat: +p[0].y, lng: +p[0].x } : null));
    };
    if (!address) return byPlace();
    new sv.Geocoder().addressSearch(address, (r, st) =>
      (st === sv.Status.OK && r[0]) ? done({ lat: +r[0].y, lng: +r[0].x }) : byPlace());
  });
}

/** 좌표가 비어 있는 시설을 주소로 채워 지도에 표시합니다 (결과는 기기에 저장해 재사용) */
async function fillMissingCoords() {
  if (S.geoBusy || !S.ready) return;
  const need = S.data.filter(r => !hasXY(r) && r.address);
  if (!need.length) return;
  S.geoBusy = true;
  const cache = geoCache(); let hit = 0;
  for (const r of need) {
    let c = cache[r.address];
    if (!c) { c = await geocode(r.address, r.name); if (c) cache[r.address] = c; }
    if (c) { r.lat = c.lat; r.lng = c.lng; r.geo = 'auto'; hit++; }
  }
  geoSave(cache); S.geoBusy = false;
  if (hit) { drawPins(); focusDeepLink(); }
}

/* ── 바로가기 주소 (NFC·QR) ─────────────────────────────────────────── */
function readDeepLink() {
  const p = new URLSearchParams(location.search);
  const t = p.get('type') || p.get('유형'), q = p.get('q'), tab = p.get('tab');
  if (t && CONFIG.types.some(x => x.name === t)) S.filterType = t;
  if (q) { S.query = q; $('#qMap').value = q; $('#qList').value = q; }
  S.focusId = p.get('id') || p.get('시설') || '';
  if (tab && ['map', 'list', 'intro'].includes(tab)) switchTab(tab);
  if (S.filterType || q || S.focusId) track('deep_link', { type: t || '', id: S.focusId, q: q || '' });
}
function focusDeepLink() {
  if (!S.focusId) return;
  const r = S.data.find(x => x.id === S.focusId);
  if (!r) return;
  if (S.map && hasXY(r)) {
    S.map.setLevel(4);
    S.map.setCenter(new kakao.maps.LatLng(r.lat, r.lng));
  }
  if (!S.focusOpened) { S.focusOpened = true; openDetail(r); }
}

/* ── 필터 ─────────────────────────────────────────────────────────── */
function filtered() {
  const q = S.query.trim().toLowerCase();
  return S.data.filter(r => {
    if (S.filterType && r.type !== S.filterType) return false;
    if (!q) return true;
    return (r.name + r.address + r.type + r.target + r.desc).toLowerCase().includes(q);
  });
}

/* ── 지도 ─────────────────────────────────────────────────────────── */
function initMap() {
  const c = CONFIG.region.center;
  S.map = new kakao.maps.Map($('#map'), {
    center: new kakao.maps.LatLng(c.lat, c.lng),
    level: CONFIG.region.level || 6
  });
  S.map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);

  if (CONFIG.region.restrictBounds && CONFIG.region.bounds) {
    const b = CONFIG.region.bounds;
    const lim = new kakao.maps.LatLngBounds(
      new kakao.maps.LatLng(b.sw.lat, b.sw.lng),
      new kakao.maps.LatLng(b.ne.lat, b.ne.lng));
    kakao.maps.event.addListener(S.map, 'dragend', () => {
      if (!lim.contain(S.map.getCenter())) S.map.setCenter(new kakao.maps.LatLng(c.lat, c.lng));
    });
  }
  S.ready = true;
  drawPins();
}

/** 같은 좌표(약 15m 이내)에 있는 시설을 하나의 핀으로 묶습니다 */
function cluster(rows) {
  const g = new Map();
  rows.forEach(r => {
    const k = r.lat.toFixed(4) + ',' + r.lng.toFixed(4);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(r);
  });
  return [...g.values()];
}

function drawPins() {
  if (!S.ready) return;
  S.overlays.forEach(o => o.setMap(null));
  S.overlays = [];

  const groups = cluster(filtered().filter(hasXY));
  const bounds = new kakao.maps.LatLngBounds();

  groups.forEach(g => {
    const head = g[0];
    const pos = new kakao.maps.LatLng(head.lat, head.lng);
    bounds.extend(pos);

    const el = document.createElement('div');
    el.className = 'pin' + (S.focusId && g.some(x => x.id === S.focusId) ? ' hl' : '');
    el.innerHTML =
      '<div class="pin-body" style="background:' + typeColor(head.type) + '">' +
      esc(head.name.length > 11 ? head.name.slice(0, 10) + '…' : head.name) +
      (g.length > 1 ? '<span class="cnt">+' + (g.length - 1) + '</span>' : '') +
      '</div><div class="pin-tail"></div>';
    el.onclick = () => (g.length > 1 ? openGroup(g) : openDetail(head));

    const ov = new kakao.maps.CustomOverlay({ position: pos, content: el, yAnchor: 1, clickable: true });
    ov.setMap(S.map);
    S.overlays.push(ov);
  });

  if (groups.length && CONFIG.region.autoFit && !S.focusId) S.map.setBounds(bounds, 60, 40, 60, 40);
}

function adminLogin() {
  if (S.isAdmin) return adminPanel();
  openModal(
    '<h3>관리자 로그인</h3>' +
    '<div class="field"><label>비밀번호</label><input type="password" id="pw" autocomplete="current-password"></div>' +

    '<button class="btn btn-primary" id="ok">로그인</button></div>');

    const pw = $('#pw').value;
    const h = await sha256(pw);
    // 화면 잠금 해제는 여기서, 실제 저장 권한은 Apps Script가 비밀번호를 다시 검사합니다.
    // (해시 값은 소스에 공개되어 있으므로 해시가 아닌 비밀번호를 보냅니다)

function toRecord(r) {

async function saveAutoCoords() {
  const rows = autoRows(); let ok = 0;
  $('#saveGeo').textContent = '저장 중… (0/' + rows.length + ')';
  for (const r of rows) {
    try {
      const res = await apiPost({ action: 'upsert', password: S.pw, record: toRecord(r) });
      if (res.ok) { ok++; r.geo = ''; }
    } catch (e) {}
    if ($('#saveGeo')) $('#saveGeo').textContent = '저장 중… (' + ok + '/' + rows.length + ')';
  }
  toast(ok + '곳의 좌표를 시트에 저장했습니다');
  localStorage.removeItem(S.META_KEY); await loadData(); adminPanel();
}

function adminForm(r) {
  const v = k => esc(r ? r[k] : '');
  openModal(
    '<h3>' + (r ? '시설 수정' : '시설 추가') + '</h3>' +
    '<div class="field"><label>시설명 *</label><input id="f_name" value="' + v('name') + '"></div>' +
    '<div class="field"><label>유형 *</label><select id="f_type">' +
      CONFIG.types.map(t => '<option' + (r && r.type === t.name ? ' selected' : '') + '>' + esc(t.name) + '</option>').join('') +
    '</select></div>' +
    '<div class="field"><label>주소 *</label><div class="addr-row"><input id="f_address" value="' + v('address') + '">' +
      '<button type="button" id="geoBtn">위치 찾기</button></div>' +
      '<div class="hint">주소만 넣으면 위도·경도는 자동으로 채워집니다.</div></div>' +
    '<div class="row2">' +
      '<div class="field"><label>위도 (자동)</label><input id="f_lat" inputmode="decimal" value="' + (r && hasXY(r) ? r.lat : '') + '"></div>' +
      '<div class="field"><label>경도 (자동)</label><input id="f_lng" inputmode="decimal" value="' + (r && hasXY(r) ? r.lng : '') + '"></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="field"><label>전화</label><input id="f_tel" value="' + v('tel') + '"></div>' +
      '<div class="field"><label>정렬순서</label><input id="f_order" inputmode="numeric" value="' + (r && r.order !== 999 ? r.order : '') + '"></div>' +
    '</div>' +
    '<div class="field"><label>홈페이지</label><input id="f_site" value="' + v('site') + '"></div>' +
    '<div class="field"><label>운영 시간</label><input id="f_hours" value="' + v('hours') + '"></div>' +
    '<div class="field"><label>휴무일</label><input id="f_closed" value="' + v('closed') + '"></div>' +
    '<div class="field"><label>이용 대상</label><input id="f_target" value="' + v('target') + '"></div>' +
    '<div class="field"><label>소개</label><textarea id="f_desc">' + v('desc') + '</textarea></div>' +
    '<div class="field"><label>노출 여부</label><select id="f_visible">' +
      '<option value="Y"' + (r && r.visible === 'N' ? '' : ' selected') + '>Y · 지도에 표시</option>' +
      '<option value="N"' + (r && r.visible === 'N' ? ' selected' : '') + '>N · 숨김</option></select></div>' +
    '<div class="btns"><button class="btn btn-ghost" id="c">취소</button>' +
    '<button class="btn btn-primary" id="save">저장</button></div>');
  $('#c').onclick = adminPanel;
  const findXY = async () => {
    const addr = $('#f_address').value.trim(), nm = $('#f_name').value.trim();
    if (!addr && !nm) { toast('주소를 먼저 입력해 주세요'); return null; }
    if (!(window.kakao && kakao.maps && kakao.maps.services)) { toast('지도 연결 후 사용할 수 있습니다. 좌표를 직접 넣어 주세요'); return null; }
    const c = await geocode(addr, nm);
    if (!c) { toast('위치를 찾지 못했습니다. 도로명 주소로 다시 입력해 주세요'); return null; }
    $('#f_lat').value = c.lat.toFixed(6); $('#f_lng').value = c.lng.toFixed(6);
    return c;
  };
  $('#geoBtn').onclick = async () => { if (await findXY()) toast('위치를 찾았습니다'); };
  $('#save').onclick = async () => {
    if ((!$('#f_lat').value.trim() || !$('#f_lng').value.trim()) && $('#f_address').value.trim()) await findXY();
    const rec = {
      id: r ? r.id : 'F' + Date.now(),
      name: $('#f_name').value.trim(), type: $('#f_type').value,
      address: $('#f_address').value.trim(),
      lat: parseFloat($('#f_lat').value), lng: parseFloat($('#f_lng').value),
      tel: $('#f_tel').value.trim(), site: $('#f_site').value.trim(),
      hours: $('#f_hours').value.trim(), closed: $('#f_closed').value.trim(),
      target: $('#f_target').value.trim(), desc: $('#f_desc').value.trim(),
      visible: $('#f_visible').value,
      order: $('#f_order').value.trim() === '' ? '' : Number($('#f_order').value)
    };
    if (!isFinite(rec.lat) || !isFinite(rec.lng)) { rec.lat = ''; rec.lng = ''; }
    if (!rec.name || (rec.lat === '' && !rec.address))
      return toast('시설명과 주소(또는 위도·경도)는 반드시 입력해야 합니다');
    if (!CONFIG.appsScriptUrl) return toast('스프레드시트 연결 후 사용할 수 있습니다');
    try {
      $('#save').textContent = '저장 중…';
      const res = await apiPost({ action: 'upsert', password: S.pw, record: rec });
      if (!res.ok) throw new Error(res.message || '저장 실패');
      toast('저장했습니다'); localStorage.removeItem(S.META_KEY);
      await loadData(); adminPanel();
    } catch (e) { toast('저장하지 못했습니다: ' + e.message); $('#save').textContent = '저장'; }
  };
}

async function adminDelete(r) {
  if (!r || !confirm('"' + r.name + '"을(를) 삭제할까요? 되돌릴 수 없습니다.')) return;
  if (!CONFIG.appsScriptUrl) return toast('스프레드시트 연결 후 사용할 수 있습니다');
  try {
    const res = await apiPost({ action: 'delete', password: S.pw, id: r.id });
    if (!res.ok) throw new Error(res.message || '삭제 실패');
    toast('삭제했습니다'); localStorage.removeItem(S.META_KEY);
    await loadData(); adminPanel();
  } catch (e) { toast('삭제하지 못했습니다: ' + e.message); }
}

/* ── 초기화 ───────────────────────────────────────────────────────── */
function switchTab(v) {
  $$('nav.tabs button').forEach(x => x.classList.toggle('on', x.dataset.v === v));
  $$('.view').forEach(x => x.classList.remove('on'));
  $('#v-' + v).classList.add('on');
  S.view = v;
  if (v === 'map' && S.map) setTimeout(() => S.map.relayout(), 60);
}

function bindUI() {
  $('#bTitle').textContent = CONFIG.brand.title;
  $('#bSub').textContent = CONFIG.brand.subtitle;
  document.title = CONFIG.brand.title + ' · ' + CONFIG.brand.subtitle;

  $$('nav.tabs button').forEach(b => b.onclick = () => {
    switchTab(b.dataset.v);
    track('tab_view', { tab: b.dataset.v });
  });

  const onQuery = e => { S.query = e.target.value; drawPins(); renderList(); };
  $('#qMap').oninput = onQuery;
  $('#qList').oninput = onQuery;

  $('#sheetBg').onclick = closeSheet;
  $('#modalBg').onclick = e => { if (e.target.id === 'modalBg') closeModal(); };
  $('#adminEntry').onclick = adminLogin;
  $('#fitBtn').onclick = () => { CONFIG.region.autoFit = true; S.focusId = ''; drawPins(); };
  $('#hereBtn').onclick = () => {
    if (!S.map) return toast('지도가 준비되지 않았습니다');
    if (!navigator.geolocation) return toast('위치 기능을 사용할 수 없습니다');
    navigator.geolocation.getCurrentPosition(
      p => { S.map.setCenter(new kakao.maps.LatLng(p.coords.latitude, p.coords.longitude)); S.map.setLevel(4); },
      () => toast('위치 권한을 허용해 주세요'));
  };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeSheet(); closeModal(); }
  });
}

function loadKakao() {
  return new Promise((ok, ng) => {
    if (!CONFIG.kakaoJsKey || CONFIG.kakaoJsKey.includes('여기에')) {
      return ng(new Error('카카오 JavaScript 키가 설정되지 않았습니다'));
    }
    const s = document.createElement('script');
    s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=' + CONFIG.kakaoJsKey + '&autoload=false&libraries=services';
    s.onload = () => kakao.maps.load(ok);
    s.onerror = () => ng(new Error('카카오 지도를 불러오지 못했습니다'));
    document.head.appendChild(s);
  });
}

function loadGA() {
  if (!CONFIG.gaMeasurementId) return;
  const s = document.createElement('script');
  s.async = true;
  s.src = 'https://www.googletagmanager.com/gtag/js?id=' + CONFIG.gaMeasurementId;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function () { dataLayer.push(arguments); };
  gtag('js', new Date());
  gtag('config', CONFIG.gaMeasurementId);
}

(async function init() {
  bindUI();
  readDeepLink();
  renderIntro();
  loadGA();
  $('#listBox').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

  try { await loadKakao(); initMap(); }
  catch (e) {
    $('#map').innerHTML =
      '<div class="empty" style="padding-top:90px"><div class="big">◌</div>' +
      esc(e.message) + '<br><span style="font-size:13px">CONFIG의 kakaoJsKey를 확인해 주세요.</span></div>';
  }
  await loadData();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
